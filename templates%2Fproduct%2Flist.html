<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
    </style>
</head>
<body>
<div class="page-container">

    <!-- 操作提示 -->
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>

    <!-- 搜索表单 -->
    <div class="card">
        <div class="card-title">🔍 商品搜索</div>
        <form class="search-form" th:action="@{/product/list}" method="get">
            <div class="form-item">
                <label>按分类</label>
                <select name="catId">
                    <option value="">全部类别</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.name}"
                            th:selected="${catId != null && catId == cat.id}"></option>
                </select>
            </div>
            <div class="form-item">
                <label>商品名称</label>
                <input type="text" name="keyword" placeholder="模糊搜索..."
                       th:value="${keyword}">
            </div>
            <div class="form-item">
                <label>最低价格</label>
                <input type="number" name="minPrice" placeholder="¥" step="0.01"
                       th:value="${minPrice}" style="min-width:100px;">
            </div>
            <div class="form-item">
                <label>最高价格</label>
                <input type="number" name="maxPrice" placeholder="¥" step="0.01"
                       th:value="${maxPrice}" style="min-width:100px;">
            </div>
            <div class="form-item">
                <label>&nbsp;</label>
                <button type="submit" class="btn btn-primary">🔍 搜索</button>
            </div>
            <div class="form-item">
                <label>&nbsp;</label>
                <a th:href="@{/product/list}" class="btn btn-warning">🔄 重置</a>
            </div>
        </form>
    </div>

    <!-- 商品列表 -->
    <div class="card">
        <div class="toolbar">
            <div class="card-title" style="margin-bottom:0;border:none;padding-bottom:0;">📦 商品列表</div>
            <a sec:authorize="hasRole('ROLE_admin')"
               th:href="@{/product/add}" class="btn btn-success">➕ 添加商品</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>图片</th>
                        <th>商品名称</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>描述</th>
                        <th>发布日期</th>
                        <th>详情</th>
                        <th sec:authorize="hasRole('ROLE_admin')">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${pageInfo == null || pageInfo.list == null || pageInfo.list.isEmpty()}">
                        <td colspan="9" style="text-align:center;padding:40px;color:#999;">
                            暂无商品数据
                        </td>
                    </tr>
                    <tr th:each="product : ${pageInfo.list}">
                        <td th:text="${product.id}">1</td>
                        <td>
                            <img class="img-cell" th:src="${product.photoUrl}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2250%22><rect fill=%22%23eee%22 width=%2280%22 height=%2250%22/><text x=%2225%22 y=%2230%22 fill=%22%23999%22 font-size=%2212%22>暂无图片</text></svg>'"
                                 th:alt="${product.name}">
                        </td>
                        <td th:text="${product.name}">高性能轻薄本</td>
                        <td>
                            <span th:if="${product.categoryName != null}"
                                  th:text="${product.categoryName}"
                                  style="background:#e8f4fd;color:#2980b9;padding:2px 10px;border-radius:12px;font-size:12px;">
                                数码电子
                            </span>
                        </td>
                        <td><span class="price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">5999.00</span></td>
                        <td th:text="${#strings.abbreviate(product.descp, 30)}">适合办公和学习的轻薄笔记本</td>
                        <td th:text="${#dates.format(product.releaseDate, 'yyyy-MM-dd')}">2024-02-15</td>
                        <td>
                            <a th:href="@{/product/detail/{id}(id=${product.id})}"
                               class="btn btn-sm btn-primary">详情</a>
                        </td>
                        <td sec:authorize="hasRole('ROLE_admin')">
                            <div class="btn-group">
                                <a th:href="@{/product/edit/{id}(id=${product.id})}"
                                   class="btn btn-sm btn-primary">编辑</a>
                                <a th:href="@{/product/delete/{id}(id=${product.id})}"
                                   class="btn btn-sm btn-danger"
                                   th:data-name="${product.name}"
                                   onclick="return confirm('确定要删除「'+this.dataset.name+'」吗？')">删除</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 分页导航 -->
        <div class="pagination" th:if="${pageInfo != null && pageInfo.pages > 1}">
            <!-- 首页 -->
            <a th:if="${pageInfo.pageNum > 1}"
               th:href="@{/product/list(page=1, size=${pageInfo.pageSize}, catId=${catId}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                首页
            </a>
            <span class="disabled" th:if="${pageInfo.pageNum <= 1}">首页</span>

            <!-- 上一页 -->
            <a th:if="${pageInfo.pageNum > 1}"
               th:href="@{/product/list(page=${pageInfo.pageNum - 1}, size=${pageInfo.pageSize}, catId=${catId}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                上一页
            </a>
            <span class="disabled" th:if="${pageInfo.pageNum <= 1}">上一页</span>

            <!-- 页码导航 - 显示前后各2页 -->
            <th:block th:with="start=${pageInfo.pageNum - 2 > 0 ? pageInfo.pageNum - 2 : 1},
                               end=${pageInfo.pageNum + 2 < pageInfo.pages ? pageInfo.pageNum + 2 : pageInfo.pages}">
                <span th:if="${start > 1}">...</span>
                <th:block th:each="i : ${#numbers.sequence(start, end)}">
                    <span th:if="${i == pageInfo.pageNum}" class="current" th:text="${i}">1</span>
                    <a th:unless="${i == pageInfo.pageNum}" th:text="${i}"
                       th:href="@{/product/list(page=${i}, size=${pageInfo.pageSize}, catId=${catId}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                        1
                    </a>
                </th:block>
                <span th:if="${end < pageInfo.pages}">...</span>
            </th:block>

            <!-- 下一页 -->
            <a th:if="${pageInfo.pageNum < pageInfo.pages}"
               th:href="@{/product/list(page=${pageInfo.pageNum + 1}, size=${pageInfo.pageSize}, catId=${catId}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                下一页
            </a>
            <span class="disabled" th:if="${pageInfo.pageNum >= pageInfo.pages}">下一页</span>

            <!-- 尾页 -->
            <a th:if="${pageInfo.pageNum < pageInfo.pages}"
               th:href="@{/product/list(page=${pageInfo.pages}, size=${pageInfo.pageSize}, catId=${catId}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice})}">
                尾页
            </a>
            <span class="disabled" th:if="${pageInfo.pageNum >= pageInfo.pages}">尾页</span>

            <!-- 分页信息 -->
            <span class="info">
                共 <strong th:text="${pageInfo.total}">0</strong> 条，
                第 <strong th:text="${pageInfo.pageNum}">1</strong>/<strong th:text="${pageInfo.pages}">1</strong> 页
            </span>
        </div>
    </div>

</div>
</body>
</html>
