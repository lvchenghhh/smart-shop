<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的足迹</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .view-time { font-size: 12px; color: #999; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    </style>
</head>
<body>
<div class="page-container">

    <div class="breadcrumb">👣 我的足迹</div>

    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>

    <div class="card">
        <div class="toolbar">
            <div class="card-title" style="margin-bottom:0;border:none;padding-bottom:0;">👣 浏览足迹</div>
            <a th:if="${histories != null && !#lists.isEmpty(histories)}"
               th:href="@{/footprint/clear}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('确定要清空所有浏览足迹吗？')">🗑️ 清空足迹</a>
        </div>

        <!-- 空状态 -->
        <div th:if="${histories == null || #lists.isEmpty(histories)}" class="empty-state">
            <div class="empty-icon">👣</div>
            <p>您还没有浏览过任何商品</p>
            <a th:href="@{/product/list}" class="btn btn-primary">去逛逛 →</a>
        </div>

        <!-- 足迹列表 -->
        <div th:if="${histories != null && !#lists.isEmpty(histories)}" class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>图片</th>
                        <th>商品名称</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>最近浏览</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${histories}">
                        <td>
                            <img class="img-cell"
                                 th:src="${h.photoUrl}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2250%22><rect fill=%22%23eee%22 width=%2280%22 height=%2250%22/><text x=%2225%22 y=%2230%22 fill=%22%23999%22 font-size=%2212%22>暂无</text></svg>'"
                                 th:alt="${h.productName}">
                        </td>
                        <td>
                            <a th:href="@{/product/detail/{id}(id=${h.productId})}"
                               style="color:#3498db;text-decoration:none;font-weight:500;"
                               th:text="${h.productName}">商品名称</a>
                        </td>
                        <td>
                            <span th:if="${h.categoryName != null}"
                                  th:text="${h.categoryName}"
                                  style="background:#e8f4fd;color:#2980b9;padding:2px 10px;border-radius:12px;font-size:12px;">分类</span>
                        </td>
                        <td>
                            <span class="price" th:text="${#numbers.formatDecimal(h.price, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                        </td>
                        <td>
                            <span class="view-time" th:text="${#dates.format(h.viewedAt, 'yyyy-MM-dd HH:mm')}">2024-01-01</span>
                        </td>
                        <td>
                            <a th:href="@{/product/detail/{id}(id=${h.productId})}"
                               class="btn btn-sm btn-primary">查看详情</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
