<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧商城</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f5f5f5; }

        /* 顶部导航栏 */
        .public-header {
            height: 64px;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .public-header .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .public-header .logo a {
            color: #fff;
            text-decoration: none;
        }
        .public-header .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
        }
        .public-header .header-right a {
            color: #fff;
            text-decoration: none;
            padding: 7px 16px;
            border-radius: 6px;
            transition: background 0.3s;
        }
        .public-header .btn-login {
            background: rgba(255,255,255,0.2);
        }
        .public-header .btn-login:hover {
            background: rgba(255,255,255,0.35);
        }
        .public-header .btn-admin {
            background: rgba(255,255,255,0.15);
        }
        .public-header .btn-admin:hover {
            background: rgba(255,255,255,0.3);
        }
        .public-header .btn-logout {
            background: rgba(231,76,60,0.6);
        }
        .public-header .btn-logout:hover {
            background: rgba(231,76,60,0.85);
        }
        .public-header .welcome-text {
            color: #ecf0f1;
        }
        .public-header .welcome-text strong {
            color: #f39c12;
        }

        /* 横幅 */
        .hero {
            background: linear-gradient(135deg, #1a2a6c, #2980b9, #6dd5fa);
            color: #fff;
            text-align: center;
            padding: 48px 20px 40px;
        }
        .hero h1 {
            font-size: 32px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .hero p {
            font-size: 15px;
            opacity: 0.85;
        }

        /* 商品卡片网格 */
        .products-section {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }
        .products-section .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #3498db;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }
        .product-card .card-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background: #f0f0f0;
        }
        .product-card .card-body {
            padding: 16px;
        }
        .product-card .card-body h3 {
            font-size: 16px;
            color: #1a1a1a;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-card .card-body .card-category {
            display: inline-block;
            background: #e8f4fd;
            color: #2980b9;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .product-card .card-body .card-price {
            font-size: 22px;
            font-weight: bold;
            color: #e74c3c;
        }
        .product-card .card-body .card-price::before {
            content: '¥';
            font-size: 14px;
        }
        .product-card .card-body .card-desc {
            font-size: 13px;
            color: #999;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-products {
            text-align: center;
            padding: 60px;
            color: #bbb;
            font-size: 15px;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            color: #bbb;
            padding: 24px;
            font-size: 13px;
            border-top: 1px solid #eee;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<div class="public-header">
    <div class="logo">
        <a th:href="@{/home}">🏪 智慧商城</a>
    </div>
    <div class="header-right">
        <!-- 已登录 -->
        <th:block sec:authorize="isAuthenticated()">
            <span class="welcome-text">👋 欢迎，<strong sec:authentication="name">用户</strong></span>
            <a class="btn-admin" th:href="@{/index}">⚙️ 进入后台</a>
            <a class="btn-logout" th:href="@{/logout}">退出</a>
        </th:block>
        <!-- 未登录 -->
        <th:block sec:authorize="!isAuthenticated()">
            <a class="btn-login" th:href="@{/login}">🔑 登录</a>
        </th:block>
    </div>
</div>

<!-- 横幅 -->
<div class="hero">
    <h1>🛍️ 发现好物，智慧之选</h1>
    <p>精选优质商品，品质保障，价格透明</p>
</div>

<!-- 商品展示区 -->
<div class="products-section">
    <div class="section-title">📦 全部商品</div>

    <div th:if="${products == null || #lists.isEmpty(products)}" class="empty-products">
        暂无商品数据
    </div>

    <div class="product-grid" th:if="${products != null && !#lists.isEmpty(products)}">
        <a th:each="product : ${products}"
           th:href="@{/product/detail/{id}(id=${product.id})}"
           class="product-card">
            <img class="card-img"
                 th:src="${product.photoUrl}"
                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22190%22><rect fill=%22%23e0e0e0%22 width=%22300%22 height=%22190%22/><text x=%22110%22 y=%22100%22 fill=%22%23999%22 font-size=%2216%22>暂无图片</text></svg>'"
                 th:alt="${product.name}">
            <div class="card-body">
                <h3 th:text="${product.name}">商品名称</h3>
                <span class="card-category" th:if="${product.categoryName != null}"
                      th:text="${product.categoryName}">分类</span>
                <div class="card-price"
                     th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">0.00</div>
                <div class="card-desc" th:text="${product.descp}">描述</div>
            </div>
        </a>
    </div>
</div>

<!-- 页脚 -->
<div class="footer">
    © 2026 智慧商城 · 品质生活从这里开始
</div>

</body>
</html>
