<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加商品</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container">

    <div class="breadcrumb">
        📦 商品管理 &gt; 添加商品
    </div>

    <div class="card">
        <div class="card-title">➕ 添加新商品</div>
        <div class="form-container">
            <form th:action="@{/product/save}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label>商品名称 <span style="color:red">*</span></label>
                    <input type="text" name="name" placeholder="请输入商品名称" required>
                </div>
                <div class="form-group">
                    <label>商品图片 <span style="color:#999;font-weight:normal;">（上传图片）</span></label>
                    <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)">
                    <img id="photoPreview" src="" alt="预览"
                         style="max-width:200px;max-height:150px;margin-top:8px;border-radius:6px;display:none;object-fit:cover;">
                </div>
                <div class="form-group">
                    <label>价格 <span style="color:red">*</span></label>
                    <input type="number" name="price" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>商品分类 <span style="color:red">*</span></label>
                    <select name="catId" required>
                        <option value="">请选择分类</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>发布日期</label>
                    <input type="date" name="releaseDate"
                           th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
                </div>
                <div class="form-group">
                    <label>商品描述</label>
                    <textarea name="descp" placeholder="请输入商品描述"></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-success">💾 保存</button>
                    <a th:href="@{/product/list}" class="btn btn-warning">↩ 返回</a>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    function previewPhoto(input) {
        var preview = document.getElementById('photoPreview');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
        }
    }
</script>
</body>
</html>
