<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧商品信息管理系统</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; }
        .header { height: 60px; background: linear-gradient(135deg, #2c3e50, #3498db); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .header .logo { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
        .header .user-info { display: flex; align-items: center; gap: 12px; font-size: 14px; }
        .header .user-info a { color: #fff; text-decoration: none; padding: 6px 14px; background: rgba(255,255,255,0.15); border-radius: 4px; transition: background 0.3s; }
        .header .user-info a:hover { background: rgba(255,255,255,0.3); }
        .sidebar { width: 220px; background: #2c3e50; color: #ecf0f1; position: fixed; top: 60px; left: 0; bottom: 0; overflow-y: auto; padding-top: 10px; }
        .sidebar .menu-title { padding: 12px 20px 6px; font-size: 12px; color: #95a5a6; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar a { display: block; color: #ecf0f1; text-decoration: none; padding: 12px 24px; font-size: 15px; transition: background 0.2s; border-left: 3px solid transparent; }
        .sidebar a:hover { background: rgba(255,255,255,0.08); border-left-color: #3498db; }
        .sidebar a.active { background: rgba(52,152,219,0.2); border-left-color: #3498db; }
        .main-content { margin-left: 220px; margin-top: 60px; height: calc(100vh - 60px); }
        .main-content iframe { width: 100%; height: 100%; border: none; }
    </style>
    <script>
        function navigate(url, el) {
            document.getElementById('contentFrame').src = url;
            var links = document.querySelectorAll('.sidebar a');
            links.forEach(function(link) { link.classList.remove('active'); });
            el.classList.add('active');
        }
    </script>
</head>
<body>
<div class="header">
    <div class="logo">🏪 智慧商品信息管理系统</div>
    <div class="user-info">
        <span>👤 管理员</span>
        <span style="color:#bdc3c7;">[ROLE_admin]</span>
        <a href="login.html">退出登录</a>
    </div>
</div>
<div class="sidebar">
    <div class="menu-title">📋 主菜单</div>
    <a href="javascript:void(0)" class="active" data-url="welcome.html" onclick="navigate(this.dataset.url, this)">🏠 系统首页</a>
    <a href="javascript:void(0)" data-url="product/list.html" onclick="navigate(this.dataset.url, this)">📦 商品管理</a>
    <a href="javascript:void(0)" data-url="favorite/list.html" onclick="navigate(this.dataset.url, this)">❤️ 我的收藏</a>
    <a href="javascript:void(0)" data-url="footprint/list.html" onclick="navigate(this.dataset.url, this)">👣 我的足迹</a>
    <a href="javascript:void(0)" data-url="category/list.html" onclick="navigate(this.dataset.url, this)">📂 分类管理</a>
</div>
<div class="main-content">
    <iframe id="contentFrame" src="welcome.html"></iframe>
</div>
</body>
</html>
