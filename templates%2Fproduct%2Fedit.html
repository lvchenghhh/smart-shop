<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑商品</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container">

    <div class="breadcrumb">
        📦 商品管理 &gt; 编辑商品
    </div>

    <div class="card">
        <div class="card-title">✏️ 编辑商品</div>
        <div class="form-container">
            <form th:action="@{/product/update}" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${product.id}">
                <input type="hidden" name="oldPhotoUrl" th:value="${product.photoUrl}">

                <div class="form-group">
                    <label>商品名称 <span style="color:red">*</span></label>
                    <input type="text" name="name" th:value="${product.name}" required>
                </div>
                <div class="form-group">
                    <label>商品图片 <span style="color:#999;font-weight:normal;">（上传新图片替换）</span></label>
                    <div th:if="${product.photoUrl != null and !#strings.isEmpty(product.photoUrl)}" style="margin-bottom:8px;">
                        <span style="font-size:12px;color:#888;">当前图片：</span>
                        <img th:src="${product.photoUrl}" alt="当前图片"
                             style="max-width:150px;max-height:100px;border-radius:6px;display:block;margin-top:4px;"
                             onerror="this.style.display='none'">
                    </div>
                    <input type="file" name="photo" accept="image/*" onchange="previewPhoto(this)">
                    <img id="photoPreview" src="" alt="新图片预览"
                         style="max-width:200px;max-height:150px;margin-top:8px;border-radius:6px;display:none;object-fit:cover;">
                </div>
                <div class="form-group">
                    <label>价格 <span style="color:red">*</span></label>
                    <input type="number" name="price" step="0.01" th:value="${product.price}" required>
                </div>
                <div class="form-group">
                    <label>商品分类 <span style="color:red">*</span></label>
                    <select name="catId" required>
                        <option value="">请选择分类</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${cat.id == product.catId}"></option>
                    </select>
                </div>
                <div class="form-group">
                    <label>发布日期</label>
                    <input type="date" name="releaseDate"
                           th:value="${#dates.format(product.releaseDate, 'yyyy-MM-dd')}">
                </div>
                <div class="form-group">
                    <label>商品描述</label>
                    <textarea name="descp" th:text="${product.descp}"></textarea>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn btn-success">💾 更新</button>
                    <a th:href="@{/product/list}" class="btn btn-warning">↩ 返回</a>
                </div>
            </form>
        </div>
    </div>

</div>

<script>
    function previewPhoto(input) {
        var preview = document.getElementById('photoPreview');
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.style.display = 'none';
        }
    }
</script>
</body>
</html>
