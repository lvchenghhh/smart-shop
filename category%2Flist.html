<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page-container">
    <div class="card">
        <div class="card-title">📂 商品分类管理</div>
        <div style="margin-bottom:24px;padding:20px;background:#f8f9fa;border-radius:8px;">
            <h4 style="margin-bottom:12px;">添加新分类</h4>
            <form onsubmit="alert('演示模式：保存功能不可用');return false;" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
                <div class="form-item" style="flex:1;min-width:160px;"><label>分类名称</label><input type="text" placeholder="请输入分类名称" required style="width:100%;"></div>
                <div class="form-item" style="flex:2;min-width:200px;"><label>分类描述</label><input type="text" placeholder="请输入分类描述" style="width:100%;"></div>
                <div class="form-item"><label>&nbsp;</label><button type="submit" class="btn btn-success">➕ 添加</button></div>
            </form>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>ID</th><th>分类名称</th><th>描述</th><th>操作</th></tr></thead>
                <tbody>
                    <tr><td>1</td><td><strong>数码电子</strong></td><td>手机、电脑等3C数码产品</td><td><div class="btn-group"><button class="btn btn-sm btn-primary" onclick="alert('演示模式：编辑功能不可用')">编辑</button><a href="list.html" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除此分类吗？')">删除</a></div></td></tr>
                    <tr><td>2</td><td><strong>图书</strong></td><td>各类图书、教材</td><td><div class="btn-group"><button class="btn btn-sm btn-primary" onclick="alert('演示模式：编辑功能不可用')">编辑</button><a href="list.html" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除此分类吗？')">删除</a></div></td></tr>
                    <tr><td>3</td><td><strong>家居生活</strong></td><td>家居用品、生活百货</td><td><div class="btn-group"><button class="btn btn-sm btn-primary" onclick="alert('演示模式：编辑功能不可用')">编辑</button><a href="list.html" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除此分类吗？')">删除</a></div></td></tr>
                    <tr><td>4</td><td><strong>服装</strong></td><td>男装、女装、童装</td><td><div class="btn-group"><button class="btn btn-sm btn-primary" onclick="alert('演示模式：编辑功能不可用')">编辑</button><a href="list.html" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除此分类吗？')">删除</a></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
