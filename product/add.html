<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加商品</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="page-container">
    <div class="breadcrumb">📦 商品管理 &gt; 添加商品</div>
    <div class="card">
        <div class="card-title">➕ 添加新商品</div>
        <div class="form-container">
            <form onsubmit="alert('演示模式：保存功能不可用');return false;">
                <div class="form-group"><label>商品名称 <span style="color:red">*</span></label><input type="text" placeholder="请输入商品名称" required></div>
                <div class="form-group"><label>商品图片 <span style="color:#999;font-weight:normal;">（上传图片）</span></label><input type="file" accept="image/*"></div>
                <div class="form-group"><label>价格 <span style="color:red">*</span></label><input type="number" step="0.01" placeholder="0.00" required></div>
                <div class="form-group"><label>商品分类 <span style="color:red">*</span></label><select required><option value="">请选择分类</option><option>数码电子</option><option>图书</option><option>家居生活</option><option>服装</option></select></div>
                <div class="form-group"><label>发布日期</label><input type="date" value="2024-07-03"></div>
                <div class="form-group"><label>商品描述</label><textarea placeholder="请输入商品描述"></textarea></div>
                <div class="btn-group"><button type="submit" class="btn btn-success">💾 保存</button><a href="list.html" class="btn btn-warning">↩ 返回</a></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
