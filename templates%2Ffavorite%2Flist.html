<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .favorite-time {
            font-size: 12px;
            color: #999;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #bbb;
        }
        .empty-state .empty-icon {
            font-size: 60px;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="page-container">

    <!-- 面包屑 -->
    <div class="breadcrumb">
        ❤️ 我的收藏
    </div>

    <!-- 操作提示 -->
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>

    <!-- 收藏列表 -->
    <div class="card">
        <div class="card-title">❤️ 我的收藏</div>

        <!-- 空状态 -->
        <div th:if="${favorites == null || #lists.isEmpty(favorites)}" class="empty-state">
            <div class="empty-icon">📭</div>
            <p>您还没有收藏任何商品</p>
            <a th:href="@{/product/list}" class="btn btn-primary">去逛逛 →</a>
        </div>

        <!-- 收藏列表表格 -->
        <div th:if="${favorites != null && !#lists.isEmpty(favorites)}" class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>图片</th>
                        <th>商品名称</th>
                        <th>分类</th>
                        <th>价格</th>
                        <th>收藏时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="fav : ${favorites}">
                        <td>
                            <img class="img-cell"
                                 th:src="${fav.photoUrl}"
                                 onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2250%22><rect fill=%22%23eee%22 width=%2280%22 height=%2250%22/><text x=%2225%22 y=%2230%22 fill=%22%23999%22 font-size=%2212%22>暂无</text></svg>'"
                                 th:alt="${fav.productName}">
                        </td>
                        <td>
                            <a th:href="@{/product/detail/{id}(id=${fav.productId})}"
                               style="color:#3498db;text-decoration:none;font-weight:500;"
                               th:text="${fav.productName}">商品名称</a>
                        </td>
                        <td>
                            <span th:if="${fav.categoryName != null}"
                                  th:text="${fav.categoryName}"
                                  style="background:#e8f4fd;color:#2980b9;padding:2px 10px;border-radius:12px;font-size:12px;">
                                分类
                            </span>
                        </td>
                        <td>
                            <span class="price" th:text="${#numbers.formatDecimal(fav.price, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                        </td>
                        <td>
                            <span class="favorite-time" th:text="${#dates.format(fav.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</span>
                        </td>
                        <td>
                            <div class="btn-group">
                                <a th:href="@{/product/detail/{id}(id=${fav.productId})}"
                                   class="btn btn-sm btn-primary">查看详情</a>
                                <a th:href="@{/favorite/removeFromList/{id}(id=${fav.productId})}"
                                   class="btn btn-sm btn-danger"
                                   th:data-name="${fav.productName}"
                                   onclick="return confirm('确定要取消收藏「'+this.dataset.name+'」吗？')">取消收藏</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
