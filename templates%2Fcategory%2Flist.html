<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-container">

    <!-- 操作提示 -->
    <div class="alert alert-success" th:if="${msg}" th:text="${msg}"></div>

    <div class="card">
        <div class="card-title">📂 商品分类管理</div>

        <!-- 添加分类表单 -->
        <div style="margin-bottom:24px;padding:20px;background:#f8f9fa;border-radius:8px;">
            <h4 style="margin-bottom:12px;">添加新分类</h4>
            <form th:action="@{/category/save}" method="post" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
                <div class="form-item" style="flex:1;min-width:160px;">
                    <label>分类名称</label>
                    <input type="text" name="name" placeholder="请输入分类名称" required style="width:100%;">
                </div>
                <div class="form-item" style="flex:2;min-width:200px;">
                    <label>分类描述</label>
                    <input type="text" name="descp" placeholder="请输入分类描述" style="width:100%;">
                </div>
                <div class="form-item">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-success">➕ 添加</button>
                </div>
            </form>
        </div>

        <!-- 分类列表表格 -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>分类名称</th>
                        <th>描述</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${categories == null || categories.isEmpty()}">
                        <td colspan="4" style="text-align:center;padding:40px;color:#999;">
                            暂无分类数据
                        </td>
                    </tr>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td>
                            <strong th:text="${cat.name}">数码电子</strong>
                        </td>
                        <td th:text="${cat.descp}">手机、电脑等3C数码产品</td>
                        <td>
                            <div class="btn-group">
                                <!-- 编辑按钮触发内联编辑 -->
                                <button class="btn btn-sm btn-primary"
                                        th:data-id="${cat.id}"
                                        th:data-name="${cat.name}"
                                        th:data-descp="${cat.descp}"
                                        onclick="editCategory(this.dataset.id, this.dataset.name, this.dataset.descp)">
                                    编辑
                                </button>
                                <a th:href="@{/category/delete/{id}(id=${cat.id})}"
                                   class="btn btn-sm btn-danger"
                                   th:data-name="${cat.name}"
                                   onclick="return confirm('确定要删除分类「'+this.dataset.name+'」吗？如果有商品关联此分类，删除可能会失败。')">
                                    删除
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 编辑分类弹窗 -->
    <div id="editModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;">
        <div style="background:#fff;border-radius:12px;padding:28px;width:420px;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
            <h3 style="margin-bottom:20px;">✏️ 编辑分类</h3>
            <form th:action="@{/category/save}" method="post">
                <input type="hidden" name="id" id="editId">
                <div class="form-group">
                    <label>分类名称</label>
                    <input type="text" name="name" id="editName" required>
                </div>
                <div class="form-group">
                    <label>分类描述</label>
                    <input type="text" name="descp" id="editDescp">
                </div>
                <div class="btn-group" style="justify-content:flex-end;">
                    <button type="button" class="btn btn-warning"
                            onclick="document.getElementById('editModal').style.display='none'">取消</button>
                    <button type="submit" class="btn btn-success">💾 保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function editCategory(id, name, descp) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editDescp').value = descp;
        document.getElementById('editModal').style.display = 'flex';
    }
    // 点击遮罩关闭
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) { this.style.display = 'none'; }
    });
</script>
</body>
</html>
